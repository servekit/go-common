# Based on ai-kit-studio/skills/golang-development — Google Go Style Guide
# 对应关系见每条注释中的 [规范§x]

version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt                          # 始终用 gofmt 格式化
    - goimports                      # import 分组排序(标准库->第三方->内部)

  settings:
    gofmt:
      simplify: true                 # gofmt -s 简化代码
    goimports:
      local-prefixes:
        - go-common                  # 项目内部包放在最后一组 [规范§7: import 分组]

linters:
  disable-all: true
  enable:
    # ── 静态分析 ──
    - govet                          # 可疑代码结构 [规范§13]
    - staticcheck                    # 未使用变量/函数、冗余代码、常见 bug (v2 已包含 gosimple/unused/typecheck)
    - ineffassign                    # 无效赋值

    # ── 错误处理 [规范§2] ──
    - errcheck                       # 未检查的错误返回值 [规范§12 反模式: 忽略 error]
    - nilerr                         # 返回 nil 时误返回了非 nil error
    - errorlint                      # 鼓励用 %w 包装、errors.Is/As 比较 [规范§2: 不用字符串比较判断 error]

    # ── 代码质量 ──
    - revive                         # 风格/命名/注释规则(见下方 settings)
    - gocritic                       # 性能与风格建议, 包含裸 return 检查 [规范§12 反模式: 裸 return]
    - unparam                        # 未使用的函数参数
    - prealloc                       # slice 预分配提示 [规范§8: make([]T, 0, cap)]
    - unconvert                      # 不必要的类型转换
    - misspell                       # 拼写错误
    - decorder                       # 声明顺序: type → const → var → func [规范§7]

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam                  # 过于严格, 按需开启
        - rangeValCopy               # 过于严格

    revive:
      rules:
        # ── 命名 [规范§1] ──
        - name: var-naming           # MixedCaps, 不用下划线
          arguments:
            - ["ID", "HTTP", "API", "URL", "JSON", "TCP", "UDP", "IP", "SSH", "SQL", "RPC", "SMS"]
        - name: receiver-naming      # receiver 1-2 个字母, 短且一致 [规范§1: Receiver]
        - name: get-return           # 不加 Get 前缀 [规范§1: Getter]
        - name: exported             # 导出标识符必须有 doc comment [规范§6]
        - name: package-comments     # 包注释 [规范§6]

        # ── 错误处理 [规范§2] ──
        - name: error-return         # error 应为最后一个返回值
        - name: error-strings        # 错误字符串不大写、不以句号结尾
        - name: error-naming         # sentinel error 用 Err 前缀
        - name: errorf               # 用 fmt.Errorf 而非 errors.New 格式化
        - name: indent-error-flow    # 缩进错误处理路径 [规范§2: 返回错误]

        # ── Context [规范§11] ──
        - name: context-as-argument  # context 作为第一个参数
        - name: context-keys-type    # 不用基本类型作为 context key

        # ── 代码风格 [规范§8][§12] ──
        - name: bare-return          # 禁止裸 return [规范§12 反模式]
        - name: unused-parameter     # 未使用的参数
        - name: unused-receiver      # 未使用的 receiver
        - name: unnecessary-stmt     # 不必要的语句
        - name: increment-decrement  # 用 i++ 而非 i += 1
        - name: unexported-naming    # 导出类型中引用未导出类型名提示
        - name: modifies-parameter   # 不要修改函数参数
        - name: confusing-results    # 返回值应有命名以避免混淆
        - name: deep-exit            # 避免在库代码中调用 os.Exit [规范§2: 避免 panic]
        # dot import 限制已移除: 项目统一使用 testify, 测试文件中 dot import 是常见写法

    errcheck:
      check-type-assertions: true    # 类型断言也要检查 ok
      check-blank: true              # _ = mayFail() 也报错 [规范§12 反模式: 忽略 error]

    errorlint:
      errorf: true                   # 建议 %w 包装
      asserts: true                  # 建议 errors.Is/As
      comparison: true               # 禁止 err == errString

    decorder:
      disable-dec-order-check: true   # 不强制 type→const→var→func 严格顺序（与 skill §7 "构造函数紧贴类型" 冲突）
      disable-init-func-first-check: false # init() 必须在最前 [规范§7]
      disable-dec-num-check: true     # 不强制每类声明只允许一个块（多个不相关 type 不应被迫合并）

  exclusions:
    rules:
      # 测试文件放宽要求
      - path: _test\.go
        linters:
          - errcheck
          - revive                   # 测试中允许缺少 doc comment
          - errorlint
          - gocritic

      # generated protobuf 代码跳过所有检查
      - path: ".*\\.pb\\.go$"
        linters:
          - all
